<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Event Manager | Campus Portal Login</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        
        <div class="card p-4 shadow-lg border-0">
          <div class="text-center mb-4">
            <div class="display-5 mb-2">⚡</div>
            <h3 class="fw-bold text-white mb-1">AI Event Manager</h3>
            <p class="text-muted small">Campus Multi-Agent Event Intelligence Portal</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label for="login-reg-id" class="form-label text-light small fw-bold">Registration ID</label>
              <input type="text" id="login-reg-id" class="form-control" placeholder="e.g. ADM001, STF001, STU001" required autocomplete="username">
            </div>

            <div class="mb-4">
              <label for="login-password" class="form-label text-light small fw-bold">Password</label>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-bold">
              Sign In to Portal
            </button>
          </form>

          <!-- Demo Accounts Selector -->
          <div class="mt-4 pt-3 border-top border-secondary">
            <div class="small fw-bold text-light mb-2">⚡ Quick Demo Selector (Click to fill):</div>
            <div class="d-flex flex-column gap-1">
              <div class="demo-chip" data-regid="ADM001" data-pass="AdminPass#2026">
                <strong>Admin:</strong> Dr. Aris Thorne (<code>ADM001</code>)
              </div>
              <div class="demo-chip" data-regid="STF001" data-pass="StaffPass#001">
                <strong>Staff (CSE):</strong> Prof. Rajesh Raman (<code>STF001</code>)
              </div>
              <div class="demo-chip" data-regid="STF002" data-pass="StaffPass#002">
                <strong>Staff (ECE):</strong> Dr. Meenakshi Sundaram (<code>STF002</code>)
              </div>
              <div class="demo-chip" data-regid="STU001" data-pass="StudentPass#001">
                <strong>Student (CSE):</strong> Aarav Sharma (<code>STU001</code>)
              </div>
              <div class="demo-chip" data-regid="STU002" data-pass="StudentPass#002">
                <strong>Student (AI&DS):</strong> Aditi Verma (<code>STU002</code>)
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
